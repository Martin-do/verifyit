<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VerifyIt</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #171717; background: #f6f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(820px, calc(100% - 32px)); margin: 48px auto; }
    .eyebrow { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .75rem; }
    h1 { font-size: clamp(2.2rem, 7vw, 4.5rem); line-height: .95; margin: 12px 0 16px; }
    .lead { font-size: 1.08rem; line-height: 1.6; max-width: 680px; }
    .card { background: white; border: 1px solid #dedede; border-radius: 18px; padding: 22px; margin-top: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.05); }
    textarea { width: 100%; min-height: 180px; resize: vertical; border: 1px solid #ccc; border-radius: 12px; padding: 14px; font: inherit; }
    button { margin-top: 12px; border: 0; border-radius: 999px; padding: 12px 18px; font: inherit; font-weight: 700; cursor: pointer; background: #171717; color: white; }
    button:disabled { opacity: .5; cursor: wait; }
    #result { display: none; margin-top: 20px; border-top: 1px solid #e6e6e6; padding-top: 20px; }
    .verdict { font-size: 1.4rem; font-weight: 800; }
    .meta { font-size: .9rem; color: #555; line-height: 1.5; }
    .warning { padding: 12px; border-radius: 10px; background: #fff4d6; line-height: 1.5; margin-top: 10px; }
    .evidence { margin-top: 20px; }
    .evidence article { border-top: 1px solid #e8e8e8; padding: 15px 0; }
    .evidence a { color: inherit; font-weight: 750; }
    .rating { font-weight: 700; }
    .snippet { line-height: 1.5; margin-top: 6px; }
    .passage { line-height: 1.55; margin-top: 9px; padding: 10px 12px; background: #f5f5f5; border-radius: 9px; }
    .badge { display: inline-block; padding: 3px 8px; margin: 6px 6px 0 0; border: 1px solid #ddd; border-radius: 999px; font-size: .78rem; color: #444; }
    .stance { font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">VerifyIt MVP · 0.4</div>
    <h1>Check before you believe, pay, or share.</h1>
    <p class="lead">Paste a claim or public link. VerifyIt retrieves candidate evidence, inspects strong source pages, and keeps uncertain or conflicting claims explicitly unverified.</p>

    <section class="card">
      <form id="verify-form">
        <label for="content"><strong>What should we check?</strong></label>
        <textarea id="content" placeholder="Paste a claim, Facebook/Instagram/X link, message, or other text..." required></textarea>
        <button id="submit" type="submit">Check it</button>
      </form>

      <div id="result">
        <div id="verdict" class="verdict"></div>
        <p id="summary"></p>
        <div id="meta" class="meta"></div>
        <div id="warnings"></div>
        <div id="evidence" class="evidence"></div>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('verify-form');
    const button = document.getElementById('submit');
    const result = document.getElementById('result');
    const verdict = document.getElementById('verdict');
    const summary = document.getElementById('summary');
    const meta = document.getElementById('meta');
    const warnings = document.getElementById('warnings');
    const evidence = document.getElementById('evidence');

    const extractionLabels = {
      not_applicable: 'not applicable', accessed: 'page accessed', partial: 'partially accessible',
      platform_only: 'platform reached; post unavailable', blocked: 'content blocked',
      fetch_failed: 'fetch failed', rejected: 'URL rejected'
    };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }
    function pct(value) { return value == null ? null : Math.round(Number(value) * 100) + '%'; }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'Checking…';
      result.style.display = 'none';

      try {
        const response = await fetch('/api/v1/verify', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: document.getElementById('content').value, input_type: 'auto' })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Request failed');

        verdict.textContent = `${data.verdict} · ${Math.round((data.confidence || 0) * 100)}%`;
        summary.textContent = data.summary;
        const extractionLabel = extractionLabels[data.extraction_status] || data.extraction_status;
        meta.textContent = `Input: ${data.detected_input_type} · Extraction: ${extractionLabel}${data.extracted_title ? ' · ' + data.extracted_title : ''}`;
        warnings.innerHTML = (data.warnings || []).map(item => `<div class="warning">${escapeHtml(item)}</div>`).join('');

        if (data.evidence && data.evidence.length) {
          evidence.innerHTML = '<strong>Evidence</strong>' + data.evidence.map(item => `
            <article>
              <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>
              <div>
                ${item.stance ? `<span class="badge stance">${escapeHtml(item.stance)}</span>` : ''}
                ${item.source_label ? `<span class="badge">${escapeHtml(item.source_label)}</span>` : ''}
                ${item.quality_score != null ? `<span class="badge">quality ${pct(item.quality_score)}</span>` : ''}
                ${item.authority_score != null ? `<span class="badge">authority ${pct(item.authority_score)}</span>` : ''}
                ${item.relevance_score != null ? `<span class="badge">search relevance ${pct(item.relevance_score)}</span>` : ''}
                ${item.stance_score != null && item.stance !== 'UNCLEAR' ? `<span class="badge">stance confidence ${pct(item.stance_score)}</span>` : ''}
              </div>
              <div class="meta">${escapeHtml(item.publisher || '')}${item.review_date ? (item.publisher ? ' · ' : '') + escapeHtml(item.review_date) : ''}${item.match_score != null ? ' · claim match ' + pct(item.match_score) : ''}</div>
              ${item.passage ? `<div class="passage"><strong>Inspected passage</strong><br>${escapeHtml(item.passage)}</div>` : (item.snippet ? `<div class="snippet">${escapeHtml(item.snippet)}</div>` : '')}
              ${item.rating ? `<div class="rating">Published rating: ${escapeHtml(item.rating)}</div>` : ''}
              ${item.claim_text ? `<div class="meta">Reviewed claim: ${escapeHtml(item.claim_text)}</div>` : ''}
            </article>`).join('');
        } else {
          evidence.innerHTML = '';
        }
        result.style.display = 'block';
      } catch (error) {
        verdict.textContent = 'ERROR';
        summary.textContent = 'The local VerifyIt API could not process this request.';
        warnings.innerHTML = `<div class="warning">${escapeHtml(error)}</div>`;
        evidence.innerHTML = '';
        result.style.display = 'block';
      } finally {
        button.disabled = false;
        button.textContent = 'Check it';
      }
    });
  </script>
</body>
</html>
