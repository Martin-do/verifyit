<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VerifyIt</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #171717; background: #f6f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(760px, calc(100% - 32px)); margin: 56px auto; }
    .eyebrow { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .75rem; }
    h1 { font-size: clamp(2.2rem, 7vw, 4.5rem); line-height: .95; margin: 12px 0 16px; }
    .lead { font-size: 1.08rem; line-height: 1.6; max-width: 640px; }
    .card { background: white; border: 1px solid #dedede; border-radius: 18px; padding: 22px; margin-top: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.05); }
    textarea { width: 100%; min-height: 180px; resize: vertical; border: 1px solid #ccc; border-radius: 12px; padding: 14px; font: inherit; }
    button { margin-top: 12px; border: 0; border-radius: 999px; padding: 12px 18px; font: inherit; font-weight: 700; cursor: pointer; background: #171717; color: white; }
    button:disabled { opacity: .5; cursor: wait; }
    #result { display: none; margin-top: 20px; border-top: 1px solid #e6e6e6; padding-top: 20px; }
    .verdict { font-size: 1.4rem; font-weight: 800; }
    .warning { padding: 12px; border-radius: 10px; background: #fff4d6; line-height: 1.5; }
    code { background: #eee; border-radius: 5px; padding: 2px 5px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">VerifyIt MVP</div>
    <h1>Check before you believe, pay, or share.</h1>
    <p class="lead">Paste a claim or link. This first development build establishes the verification interface; it deliberately refuses to invent a verdict until evidence retrieval is connected.</p>

    <section class="card">
      <form id="verify-form">
        <label for="content"><strong>What should we check?</strong></label>
        <textarea id="content" placeholder="Paste a claim, Facebook/Instagram/X link, message, or other text..." required></textarea>
        <button id="submit" type="submit">Check it</button>
      </form>

      <div id="result">
        <div id="verdict" class="verdict"></div>
        <p id="summary"></p>
        <div id="warning" class="warning"></div>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('verify-form');
    const button = document.getElementById('submit');
    const result = document.getElementById('result');
    const verdict = document.getElementById('verdict');
    const summary = document.getElementById('summary');
    const warning = document.getElementById('warning');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'Checking…';
      result.style.display = 'none';

      try {
        const response = await fetch('/api/v1/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: document.getElementById('content').value, input_type: 'auto' })
        });
        const data = await response.json();
        if (!response.ok) throw new Error('Request failed');
        verdict.textContent = data.verdict;
        summary.textContent = data.summary;
        warning.textContent = data.warnings[0] || 'No warning.';
        result.style.display = 'block';
      } catch (error) {
        verdict.textContent = 'ERROR';
        summary.textContent = 'The local VerifyIt API could not process this request.';
        warning.textContent = String(error);
        result.style.display = 'block';
      } finally {
        button.disabled = false;
        button.textContent = 'Check it';
      }
    });
  </script>
</body>
</html>
